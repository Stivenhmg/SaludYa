<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>

        Confirmación | SaludYa

    </title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>


    <header class="navbar">


        <div class="logo">

            <h2>

                SaludYa

            </h2>

        </div>


        <nav class="nav-menu">

            <a href="index.html">

                Inicio

            </a>

            <a href="horarios.html">

                Horarios

            </a>

            <a href="agendar.html">

                Agendar

            </a>

            <a href="citas.html">

                Mis citas

            </a>

        </nav>


        <div class="nav-user">


            <span class="nav-username">

                Usuario

            </span>


            <button class="logout-btn">

                Salir

            </button>


        </div>


    </header>



    <main class="center-page">


        <div class="confirmation-card">


            <div class="success-icon">

                ✓

            </div>



            <h1>

                ¡Cita Confirmada!

            </h1>



            <p>

                Tu cita ha sido agendada exitosamente

            </p>



            <div class="confirmation-details">


                <div class="confirm-row">

                    <span>

                        Servicio

                    </span>

                    <strong id="confirm-servicio">

                        -

                    </strong>

                </div>



                <div class="confirm-row">

                    <span>

                        Fecha

                    </span>

                    <strong id="confirm-fecha">

                        -

                    </strong>

                </div>



                <div class="confirm-row">

                    <span>

                        Hora

                    </span>

                    <strong id="confirm-hora">

                        -

                    </strong>

                </div>



                <div class="confirm-row">

                    <span>

                        Estado

                    </span>

                    <strong class="status-ok">

                        Confirmada

                    </strong>

                </div>


            </div>



            <div class="hero-buttons">


                <a href="agendar.html" class="primary-btn">

                    Agendar otra cita

                </a>



                <a href="citas.html" class="secondary-btn">

                    Ver mis citas

                </a>


            </div>


        </div>


    </main>


    <script src="js/app.js"></script>

</body>

</html>
