<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>

        Agendar cita | SaludYa

    </title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>


    <header class="navbar">


        <div class="logo">

            <h2>

                SaludYa

            </h2>

        </div>


        <nav class="nav-menu">

            <a href="index.html">

                Inicio

            </a>

            <a href="horarios.html">

                Horarios

            </a>

            <a href="agendar.html">

                Agendar

            </a>

            <a href="citas.html">

                Mis citas

            </a>

        </nav>


        <div class="nav-user">


            <span class="nav-username">

                Usuario

            </span>


            <button class="logout-btn">

                Salir

            </button>


        </div>


    </header>



    <main class="center-page">


        <form class="appointment-form appointment-card">


            <h1>

                Agendar cita

            </h1>


            <p>

                Completa los datos para reservar

            </p>



            <label>

                Servicio

            </label>

            <select>

                <option>

                    Consulta General

                </option>

                <option>

                    Revisión

                </option>

                <option>

                    Odontología

                </option>

            </select>



            <label>

                Fecha

            </label>

            <input type="date" id="appointment-date" required>



            <label>

                Hora

            </label>



            <div class="time-grid">


                <button type="button" class="hour-btn">

                    08:00

                </button>


                <button type="button" class="hour-btn">

                    08:30

                </button>


                <button type="button" class="hour-btn">

                    09:00

                </button>


                <button type="button" class="hour-btn">

                    09:30

                </button>


                <button type="button" class="hour-btn">

                    10:00

                </button>


                <button type="button" class="hour-btn">

                    10:30

                </button>


                <button type="button" class="hour-btn">

                    11:00

                </button>


                <button type="button" class="hour-btn">

                    11:30

                </button>


                <button type="button" class="hour-btn">

                    12:00

                </button>


                <button type="button" class="hour-btn">

                    14:00

                </button>


                <button type="button" class="hour-btn">

                    14:30

                </button>


                <button type="button" class="hour-btn">

                    15:00

                </button>


                <button type="button" class="hour-btn">

                    15:30

                </button>


                <button type="button" class="hour-btn">

                    16:00

                </button>


                <button type="button" class="hour-btn">

                    16:30

                </button>


            </div>



            <button type="submit" class="primary-btn confirm-btn">

                Confirmar cita

            </button>


        </form>


    </main>


    <script src="js/app.js"></script>

</body>

</html>
