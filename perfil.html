<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>

        Perfil | SaludYa

    </title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>


    <header class="navbar">


        <div class="logo">

            <h2>

                SaludYa

            </h2>

        </div>


        <nav class="nav-menu">

            <a href="index.html">

                Inicio

            </a>

            <a href="horarios.html">

                Horarios

            </a>

            <a href="agendar.html">

                Agendar

            </a>

            <a href="citas.html">

                Mis citas

            </a>

        </nav>


        <div class="nav-user">


            <span class="nav-username">

                Usuario

            </span>


            <button class="logout-btn">

                Salir

            </button>


        </div>


    </header>



    <main class="center-page">


        <div class="profile-card">


            <h1>

                Perfil

            </h1>


            <p>

                Gestiona tu información personal

            </p>



            <form class="profile-form">


                <label>

                    Nombre completo

                </label>

                <input type="text" placeholder="Tu nombre">


                <label>

                    Correo electrónico

                </label>

                <input type="email" placeholder="correo@ejemplo.com">


                <label>

                    Teléfono

                </label>

                <input type="text" placeholder="3001234567">


                <label>

                    Fecha nacimiento

                </label>

                <input type="date">


                <label>

                    Dirección

                </label>

                <input type="text" placeholder="Tu dirección">


                <button type="submit" class="primary-btn">

                    Actualizar perfil

                </button>


            </form>


        </div>


    </main>


    <script src="js/app.js"></script>

</body>

</html>
